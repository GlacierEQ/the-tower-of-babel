[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-of-babel-governance"
version = "0.1.0"
description = "Canonical registry and governance CLI for The Tower of Babel"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "GlacierEQ"}]
dependencies = []

[project.scripts]
tower = "tower_registry:main"

[tool.setuptools]
py-modules = ["babel_registry", "tower_registry"]

[tool.setuptools.package-dir]
"" = "src"
