handoff:
  startup_instructions: |
    1. Install: `python -m pip install -e .[dev]`
    2. Validate: `tower validate`
    3. Generate check: `tower generate --check`
    4. Integrity verify: `tower integrity verify`
    5. Run complete portable governance pass:
       `tower build --all --allow-blocked --output artifacts/build-report.json`
       `tower benchmark python c cpp rust go typescript webassembly --output artifacts/benchmarks.json`
       `tower proof-report --build-report artifacts/build-report.json --benchmark-report artifacts/benchmarks.json --allow-blocked --output artifacts/proof-report.json`
       `tower receipt --build-report artifacts/build-report.json --output artifacts/tower_receipt.json`
    6. Run flagship pipeline: `python flagship/run_pipeline.py`
  operator_instructions: |
    - Role: Technology placement, executable learning, truthful verification, cross-language composition, agent-readable contracts, deterministic evidence
    - A floor earns its role through runtime behavior, safety, performance, hardware fit, or interoperability — NOT decorative polyglot signaling
    - Admission requires: unique responsibility + activation conditions + easy/advanced exhibits + pinned toolchain + constraints + cross-language interfaces + evidence state + proof class + semantic claim contract
    - Working components extended rather than rewritten; new language must provide measurable value at clear boundary
    - Harmonious transcription is the LAST upgrade placed into main; when no more benefit, no more branch
    - Sovereign law: fail-closed branch retirement — cryptographic proof required that 100% unique branch benefits embodied and tested in main
    - Evidence state and runtime admission tiers are the vocabulary; never claim stronger state than observed
    - Recruiter sees accomplishment; engineer inspects execution/failure; agent initializes from verified contracts while free to compare stronger routes
