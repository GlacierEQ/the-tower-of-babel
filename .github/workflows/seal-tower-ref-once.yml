name: Seal Tower Ref Fix Once

on:
  push:
    branches:
      - dev/spiral-civilization-scale

permissions:
  contents: write

jobs:
  seal-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tower
        run: python -m pip install -e .
      - name: Remove bootstrap and generate final ledger
        run: |
          rm .github/workflows/seal-tower-ref-once.yml
          tower integrity generate
          tower integrity verify
      - name: Commit exact final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/seal-tower-ref-once.yml .integrity/file_hashes.json
          git commit -m "chore(ci): seal corrected branch-head integrity workflow"
          git push origin HEAD:dev/spiral-civilization-scale
