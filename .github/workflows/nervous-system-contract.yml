name: Nervous System Contract

on:
  push:
    branches: [main]
    paths:
      - README.md
      - src/tower/generate.py
      - governance/akos-nervous-system.v1.json
      - .glaciereq/nervous-system.node.json
      - scripts/validate_nervous_system.py
      - tests/test_nervous_system_contract.py
      - .github/workflows/nervous-system-contract.yml
  pull_request:
    paths:
      - README.md
      - src/tower/generate.py
      - governance/akos-nervous-system.v1.json
      - .glaciereq/nervous-system.node.json
      - scripts/validate_nervous_system.py
      - tests/test_nervous_system_contract.py
      - .github/workflows/nervous-system-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nervous-system-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Tower
        run: python -m pip install -e .

      - name: Materialize and reject generated-surface drift
        run: |
          set -euo pipefail
          tower generate
          git diff --exit-code -- README.md generated/ src/babel_registry.py mastermind_sidecar.py

      - name: Validate pinned nervous-system contract
        run: python scripts/validate_nervous_system.py --verify-remote --freshness
