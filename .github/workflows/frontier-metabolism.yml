name: Daily Frontier Metabolism

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-frontier-metabolism
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Tower
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch primary-source frontier observations
        run: |
          mkdir -p artifacts/frontier
          python scripts/frontier_metabolism.py \
            --sources frontier/sources.json \
            --output artifacts/frontier/observation.json

      - name: Emit source health summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/frontier/observation.json").read_text())
          print("### Tower frontier metabolism")
          print()
          print(f"- Successful primary sources: {payload['successful_sources']}")
          print(f"- Changed/first-observed sources: {len(payload['changed_sources'])}")
          print(f"- Observation time: {payload['observed_at']}")
          print()
          print("This workflow observes the frontier. Admission still requires a bounded system experiment and proof.")
          PY

      - name: Upload daily frontier receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tower-frontier-observation
          path: artifacts/frontier/observation.json
          if-no-files-found: error
          retention-days: 30
