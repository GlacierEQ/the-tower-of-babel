name: Estate Claim Derived Seal

on:
  push:
    branches:
      - synthesize/claim-contract-evidence-gates-20260807
    paths:
      - .github/workflows/estate-claim-derived-seal.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact synthesis branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: synthesize/claim-contract-evidence-gates-20260807
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install governed Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Regenerate claim-derived surfaces
        run: |
          set -euo pipefail
          tower validate
          tower generate --check
          python tools/audit_advanced_exhibits.py --write
          python tools/audit_advanced_exhibits.py --check
          pytest -q tests/test_evidence_promotion_requirements.py tests/test_claim_contracts.py
      - name: Remove ephemeral workflow and seal exact tree
        run: |
          set -euo pipefail
          rm .github/workflows/estate-claim-derived-seal.yml
          python - <<'PY'
          from pathlib import Path
          from tower.integrity import write_manifest
          write_manifest(Path('.integrity/file_hashes.json'))
          PY
          tower integrity verify
      - name: Commit derived surfaces and exact ledger
        run: |
          set -euo pipefail
          git config user.name "GlacierEQ Estate Evolution"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ADVANCED_EXHIBITS.md quality/advanced_exhibit_atlas.json .integrity/file_hashes.json .github/workflows/estate-claim-derived-seal.yml
          git commit -m "chore(claims): regenerate atlas and seal evidence gates"
          git push origin HEAD:synthesize/claim-contract-evidence-gates-20260807
