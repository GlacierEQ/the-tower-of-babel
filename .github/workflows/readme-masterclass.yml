# Retry after repairing the standalone Go telemetry exhibit.
name: README Masterclass Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-masterclass.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-masterclass-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply generator-owned README upgrade
        run: python .github/scripts/apply_readme_masterclass.py

      - name: Install Tower
        run: python -m pip install -e .[dev]

      - name: Regenerate and reseal
        run: |
          tower validate
          python -m tower.generate
          rm .github/workflows/readme-masterclass.yml
          rm .github/scripts/apply_readme_masterclass.py
          python - <<'PY'
          from tower.integrity import write_manifest
          write_manifest()
          PY

      - name: Verify the exact final tree
        run: |
          tower generate --check
          pytest -q
          tower integrity verify
          tower build --all --allow-blocked --output artifacts/readme-masterclass-build-report.json

      - name: Commit verified upgrade to main
        run: |
          git config user.name "GlacierEQ Tower Automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md src/tower/generate.py .integrity/file_hashes.json languages/go/advanced_telemetry_decoder.go .github/workflows/readme-masterclass.yml .github/scripts/apply_readme_masterclass.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No README upgrade drift remained."
            exit 0
          fi
          git commit -m "docs(readme): masterclass the three-layer Tower entrypoint"
          git push origin HEAD:main
