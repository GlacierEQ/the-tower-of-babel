'''
          """

          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY

      - name: Install Tower
        run: python -m pip install -e .[dev]

      - name: Regenerate and reseal
        run: |
          tower validate
          python -m tower.generate
          rm .github/workflows/readme-masterclass.yml
          python - <<'PY'
          from tower.integrity import write_manifest
          write_manifest()
          PY

      - name: Verify the exact final tree
        run: |
          tower generate --check
          pytest -q
          tower integrity verify
          tower build --all --allow-blocked --output artifacts/readme-masterclass-build-report.json

      - name: Commit the verified upgrade to main
        run: |
          git config user.name "GlacierEQ Tower Automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md src/tower/generate.py .integrity/file_hashes.json .github/workflows/readme-masterclass.yml
          if git diff --cached --quiet; then
            echo "No README upgrade drift remained."
            exit 0
          fi
          git commit -m "docs(readme): masterclass the three-layer Tower entrypoint"
          git push origin HEAD:main
