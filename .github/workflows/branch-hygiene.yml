name: Branch Lineage Audit

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: branch-lineage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preserve-merged-pr-head-lineage:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read back merged PR head without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          remote_sha=""
          state="READBACK_UNRESOLVED"
          detail="Provider readback has not completed."
          relationship="MERGED_WITH"
          rule="Merged PR state proves overlap only; it never proves UNIQUE_CONTRIBUTION=0 or authorizes ref deletion."

          write_receipt() {
            jq -n \
              --arg schema "glaciereq.branch-lineage.receipt.v2" \
              --arg repository "${REPOSITORY}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg branch "${BRANCH}" \
              --arg expected_sha "${EXPECTED_SHA}" \
              --arg observed_sha "${remote_sha}" \
              --arg state "${state}" \
              --arg relationship "${relationship}" \
              --arg detail "${detail}" \
              --arg rule "${rule}" \
              '{schema:$schema,repository:$repository,pr_number:($pr_number|tonumber),branch:$branch,expected_sha:$expected_sha,observed_sha:$observed_sha,state:$state,relationship:$relationship,detail:$detail,rule:$rule}' \
              > artifacts/branch-lineage-receipt.json
          }

          if ! refs_json=$(gh api "repos/${REPOSITORY}/git/matching-refs/heads/" 2>artifacts/provider-readback-error.txt); then
            detail="Provider branch readback failed; lineage state remains unresolved."
            write_receipt
            cat artifacts/provider-readback-error.txt >&2
            exit 1
          fi

          if ! matches=$(printf '%s' "${refs_json}" | jq -ce --arg ref "refs/heads/${BRANCH}" 'if type == "array" then [.[] | select(.ref == $ref)] else error("expected array") end'); then
            detail="Provider returned an invalid branch-readback response; lineage state remains unresolved."
            write_receipt
            exit 1
          fi
          match_count=$(printf '%s' "${matches}" | jq 'length')

          if [[ "${match_count}" == "0" ]]; then
            state="LINEAGE_REF_CONFIRMED_ABSENT"
            detail="Provider readback completed and returned no exact matching branch ref."
          elif [[ "${match_count}" == "1" ]]; then
            remote_sha=$(printf '%s' "${matches}" | jq -er '.[0].object.sha | select(type == "string" and test("^[0-9a-fA-F]{40}$"))') || {
              detail="Provider returned the exact ref without a valid 40-character object SHA."
              write_receipt
              exit 1
            }
            if [[ "${remote_sha}" == "${EXPECTED_SHA}" ]]; then
              state="ACTIVE_IN_MESH"
              detail="Exact donor ref remains at the merged PR head SHA."
            else
              state="ACTIVE_IN_MESH_MOVED_AFTER_MERGE"
              detail="Exact donor ref exists but has moved since the merged PR event."
            fi
          else
            detail="Provider returned multiple exact matches; refusing ambiguous lineage classification."
            write_receipt
            exit 1
          fi

          write_receipt

      - name: Upload lineage receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-lineage-pr-${{ github.event.pull_request.number }}
          path: artifacts/branch-lineage-receipt.json
          if-no-files-found: error
          retention-days: 30

# HOLOGRAPHIC MESH ANTI-REPLACEMENT HARD LOCK
# A merged PR establishes overlap, not donor exhaustion. Remote refs are preserved.
# Fully drained donors transition to PRESERVE_DRAINED_LINEAGE only after independent
# provider-read-back UNIQUE_CONTRIBUTION=0 and explicit Operator authorization.
