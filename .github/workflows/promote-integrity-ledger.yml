name: Promote reviewed Tower integrity candidate

on:
  push:
    branches:
      - feat/evolution-placement-authority
    paths:
      - ".github/workflows/promote-integrity-ledger.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/evolution-placement-authority
          fetch-depth: 2
          persist-credentials: true
      - name: Require expected reviewed parent
        run: |
          test "$(git rev-parse HEAD^)" = "2300dccf37b27966a3907c9c67acd459a26074fd"
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Remove one-shot workflow before hashing governed tree
        run: rm .github/workflows/promote-integrity-ledger.yml
      - name: Generate exact canonical manifest candidate
        run: |
          python - <<'PY'
          from tower.integrity import write_manifest
          manifest = write_manifest()
          assert manifest["file_count"] == 228, manifest["file_count"]
          assert manifest["hashes"]["governance/evolution-placement-contract.v1.json"] == "5424739b4bf94eabd03771a36794abe1c8e82ddf356b0277682e31aaa7c028a4"
          assert manifest["hashes"]["tests/test_evolution_placement_contract.py"] == "c584612828e29e24ba54bdffbccbe96fe29d4e460c30bcdf300af1c0373fd9ac"
          PY
          test "$(sha256sum .integrity/file_hashes.json | awk '{print $1}')" = "b72f14c2f02467b076ccdaeb45d097fbe9b7cdb69d7851f9b833b1e9772bf9de"
          tower integrity verify
      - name: Commit only ledger promotion and one-shot deletion
        run: |
          git config user.name "GlacierEQ Integrity Promoter"
          git config user.email "glacier.equilibrium@gmail.com"
          git add .integrity/file_hashes.json .github/workflows/promote-integrity-ledger.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/promote-integrity-ledger.yml .integrity/file_hashes.json "
          git commit -m "proof(integrity): admit evolution placement authority"
          git push origin HEAD:feat/evolution-placement-authority
