name: Tower of Babel Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-of-babel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile Python sources
        run: >-
          python3 -m compileall -q
          src tests mastermind_sidecar.py languages/python

      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate machine-readable registry and telemetry
        run: |
          set -euo pipefail
          python3 src/babel_registry.py > /tmp/babel-registry.json
          python3 mastermind_sidecar.py > /tmp/babel-telemetry.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('/tmp/babel-registry.json').read_text())
          telemetry = json.loads(Path('/tmp/babel-telemetry.json').read_text())
          assert registry['layout']['ok'] is True, registry['layout']
          assert registry['layout']['language_count'] == 21
          assert registry['layout']['exhibit_count'] == 42
          assert telemetry['status'] == 'OPERATIONAL', telemetry
          assert telemetry['total_languages'] == 21
          assert telemetry['total_exhibits'] == 42
          PY

  native-toolchains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile and run C exhibits
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror languages/c/easy_linked_list.c -o /tmp/babel-c-easy
          cc -std=c11 -O2 -Wall -Wextra -Werror languages/c/advanced_lockfree_spsc_ring.c -o /tmp/babel-c-advanced
          /tmp/babel-c-easy
          /tmp/babel-c-advanced

      - name: Compile C++ exhibits
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror languages/cpp/easy_vector.cpp -o /tmp/babel-cpp-easy
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -c languages/cpp/advanced_kv_entropy.cpp -o /tmp/babel-cpp-advanced.o
          /tmp/babel-cpp-easy

      - name: Format and test Go exhibits
        run: |
          set -euo pipefail
          test -z "$(gofmt -l languages/go)"
          GO111MODULE=off go test ./languages/go -v

      - name: Compile and test Rust exhibits
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings languages/rust/easy_counter.rs -o /tmp/babel-rust-easy
          rustc --edition=2021 -D warnings --test languages/rust/advanced_safety_governor.rs -o /tmp/babel-rust-tests
          /tmp/babel-rust-easy
          /tmp/babel-rust-tests
