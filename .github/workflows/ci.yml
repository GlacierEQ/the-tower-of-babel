name: Tower of Babel Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-of-babel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical Tower package
        run: python -m pip install -e .[dev]

      - name: Compile Python sources
        run: python -m compileall -q src tests integrations mastermind_sidecar.py languages/python

      - name: Validate canonical registry and generated surfaces
        run: |
          tower validate
          tower generate --check

      - name: Run governed repository tests
        run: pytest -q

      - name: Verify immutable integrity ledger
        run: tower integrity verify

  native-toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.83.0"

      - name: Compile and run C exhibits
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror languages/c/easy_linked_list.c -o /tmp/babel-c-easy
          cc -std=c11 -O2 -Wall -Wextra -Werror languages/c/advanced_lockfree_spsc_ring.c -o /tmp/babel-c-advanced
          /tmp/babel-c-easy
          /tmp/babel-c-advanced

      - name: Compile C++ exhibits
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror languages/cpp/easy_vector.cpp -o /tmp/babel-cpp-easy
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -c languages/cpp/advanced_kv_entropy.cpp -o /tmp/babel-cpp-advanced.o
          /tmp/babel-cpp-easy

      - name: Format and test Go exhibits
        run: |
          set -euo pipefail
          test -z "$(gofmt -l languages/go)"
          GO111MODULE=off go test ./languages/go -v

      - name: Compile and test Rust exhibits
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings languages/rust/easy_counter.rs -o /tmp/babel-rust-easy
          rustc --edition=2021 -D warnings --test languages/rust/advanced_safety_governor.rs -o /tmp/babel-rust-tests
          /tmp/babel-rust-easy
          /tmp/babel-rust-tests
