name: One-time Contract and Sandbox Proof Promotion

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-time-contract-sandbox-proof-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.issue.title == '[tower-quality] promote Protobuf and WebAssembly behavioral proof' &&
      github.event.issue.user.login == 'GlacierEQ'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the living main worker
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tower and declared toolchains
        run: |
          python -m pip install -e .[dev]
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler wabt

      - name: Promote only behaviorally executed contract and sandbox floors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          compute_paths = [
              Path('registry/tower.d/compute-graphs.json'),
              Path('src/tower/data/tower.d/compute-graphs.json'),
          ]
          compute = json.loads(compute_paths[0].read_text(encoding='utf-8'))
          compute_by_id = {row['id']: row for row in compute['technologies']}
          wasm = compute_by_id['webassembly']
          wasm['evidence_state'] = 'tested'
          wasm['proof_class'] = 'behavioral'
          wasm['toolchain']['test'] = [[
              'node',
              'languages/wat/advanced_wasm_sandbox_test.js',
              'build/advanced_sandbox.wasm',
          ]]
          rendered_compute = json.dumps(compute, sort_keys=True, separators=(',', ':')) + '\n'
          for path in compute_paths:
              path.write_text(rendered_compute, encoding='utf-8')

          contract_paths = [
              Path('registry/tower.d/contracts-hardware.json'),
              Path('src/tower/data/tower.d/contracts-hardware.json'),
          ]
          contracts = json.loads(contract_paths[0].read_text(encoding='utf-8'))
          contract_by_id = {row['id']: row for row in contracts['technologies']}
          protobuf = contract_by_id['protobuf']
          protobuf['evidence_state'] = 'tested'
          protobuf['proof_class'] = 'behavioral'
          protobuf['toolchain']['build'] = [
              [
                  'protoc',
                  '--proto_path=languages/protobuf',
                  '--descriptor_set_out=build/easy_user.pb',
                  'easy_user.proto',
              ],
              [
                  'protoc',
                  '--proto_path=languages/protobuf',
                  '--proto_path=/usr/include',
                  '--python_out=build',
                  '--descriptor_set_out=build/advanced_cooling.pb',
                  '--include_imports',
                  'advanced_colossus_cooling.proto',
              ],
          ]
          protobuf['toolchain']['test'] = [[
              'python3',
              'languages/protobuf/advanced_colossus_cooling_test.py',
              'build',
          ]]
          rendered_contracts = json.dumps(contracts, sort_keys=True, separators=(',', ':')) + '\n'
          for path in contract_paths:
              path.write_text(rendered_contracts, encoding='utf-8')

          status_path = Path('quality/exhibit_status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['notes']['protobuf'] = {
              'advanced_exhibit': 'languages/protobuf/advanced_colossus_cooling.proto',
              'observed_evidence': [
                  'generated Python bindings',
                  'validated telemetry invariants',
                  'authority SHA-256 enforcement',
                  'deterministic binary serialization',
                  'binary round-trip equality',
                  'structured command receipt',
              ],
          }
          status['notes']['webassembly'] = {
              'advanced_exhibit': 'languages/wat/advanced_wasm_sandbox.wat',
              'observed_evidence': [
                  'single-page bounded linear memory',
                  'capability bitmask enforcement',
                  'fuel exhaustion rejection',
                  'out-of-bounds rejection',
                  'denied-operation immutability',
                  'observable audit counters',
              ],
          }
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Regenerate all canonical projections
        run: tower generate

      - name: Compile and execute the promoted floors
        run: |
          set -euo pipefail
          mkdir -p build
          wat2wasm languages/wat/easy_add.wat -o build/easy_add.wasm
          wat2wasm languages/wat/advanced_wasm_sandbox.wat -o build/advanced_sandbox.wasm
          node languages/wat/advanced_wasm_sandbox_test.js build/advanced_sandbox.wasm
          protoc --proto_path=languages/protobuf \
            --descriptor_set_out=build/easy_user.pb \
            easy_user.proto
          protoc --proto_path=languages/protobuf \
            --proto_path=/usr/include \
            --python_out=build \
            --descriptor_set_out=build/advanced_cooling.pb \
            --include_imports \
            advanced_colossus_cooling.proto
          python3 languages/protobuf/advanced_colossus_cooling_test.py build

      - name: Remove bootstrap workflow and reseal integrity
        run: |
          rm -f .github/workflows/one-time-contract-sandbox-proof-sync.yml
          tower integrity generate

      - name: Verify the exact final tree
        run: |
          tower validate
          tower generate --check
          pytest -q
          tower integrity verify
          git diff --check

      - name: Commit governed proof promotion
        run: |
          git config user.name 'GlacierEQ governance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'quality: promote Protobuf and WebAssembly with behavioral proof'
          git push origin HEAD:main

      - name: Close maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Protobuf and WebAssembly were compiled and executed, deterministic runtime behavior was verified, generated projections were synchronized, the integrity ledger was resealed, and the temporary workflow removed."
