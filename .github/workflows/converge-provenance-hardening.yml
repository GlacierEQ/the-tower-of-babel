name: One-Time Provenance Hardening Convergence

on:
  push:
    branches: [hardening/provenance-rulesets-claims]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-provenance-hardening
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Apply one-time source-grounded corrections
        run: |
          for helper in tools/patch_claim_contracts_once.py tools/patch_readme_generation_once.py; do
            if [[ -f "${helper}" ]]; then
              python "${helper}"
              rm "${helper}"
            fi
          done

      - name: Generate and test canonical surfaces
        run: |
          tower validate
          tower generate
          python tools/audit_advanced_exhibits.py --write
          pytest -q

      - name: Publish generated convergence if required
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Generated surfaces already converge."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: expose semantic claims and provenance surfaces"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
