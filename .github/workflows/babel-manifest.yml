name: Babel manifest integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canonical-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated artifacts
        run: python tools/generate.py --check
      - name: Run manifest and registry tests
        run: python -m unittest discover -s tests -v
      - name: Exercise Python registry
        run: python src/babel_registry.py
