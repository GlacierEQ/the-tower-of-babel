name: Babel runtime promotion

on:
  push:
    branches:
      - feature/canonical-manifest-clean
  pull_request:

permissions:
  contents: write

concurrency:
  group: babel-runtime-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-and-prove:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-manifest-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install portable toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          npm install --global typescript@5.9.2

      - name: Install checksum-verified runtime promotion
        if: ${{ hashFiles('tools/runtime_loader.py') != '' }}
        run: python tools/runtime_loader.py

      - name: Make workflow integrity independently maintainable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/update_integrity.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'EXCLUDED = {".integrity/file_hashes.json"}',
              'EXCLUDED = {".integrity/file_hashes.json", ".github/workflows/babel-manifest.yml"}',
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate native artifacts and integrity catalog
        run: |
          python tools/generate.py
          python tools/update_integrity.py

      - name: Verify canonical governance
        run: |
          python tools/generate.py --check
          python -m unittest discover -s tests -v
          python tools/update_integrity.py --check
          python src/babel_registry.py
          python mastermind_sidecar.py
          python .integrity/watchdog_daemon.py
          git diff --check

      - name: Prove portable polyglot conformance
        run: python tools/portable_checks.py --evidence artifacts/evidence/portable-conformance.json

      - name: Upload conformance receipt
        uses: actions/upload-artifact@v4
        with:
          name: babel-portable-conformance
          path: artifacts/evidence/portable-conformance.json
          if-no-files-found: error

      - name: Publish native runtime engine
        run: |
          rm -rf artifacts
          git config user.name "glaciereq-babel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: promote Babel to a proven polyglot runtime"
          git push origin HEAD:feature/canonical-manifest-clean
