name: Estate Integrity Promote

on:
  push:
    branches:
      - synthesize/operational-evidence-selection-20260807
    paths:
      - .github/workflows/estate-integrity-promote.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact synthesis branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: synthesize/operational-evidence-selection-20260807
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install governed Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Remove ephemeral workflow before hashing
        run: rm .github/workflows/estate-integrity-promote.yml
      - name: Generate and verify exact current-tree integrity ledger
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tower.integrity import write_manifest
          write_manifest(Path('.integrity/file_hashes.json'))
          PY
          tower integrity verify
      - name: Commit exact candidate and self-removal
        run: |
          set -euo pipefail
          git config user.name "GlacierEQ Estate Evolution"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .integrity/file_hashes.json .github/workflows/estate-integrity-promote.yml
          git commit -m "chore(integrity): apply native fresh-head candidate"
          git push origin HEAD:synthesize/operational-evidence-selection-20260807
