name: One-shot integrity refresh

on:
  push:
    branches:
      - synthesize/checkout-v7-20260807

permissions:
  contents: write

concurrency:
  group: tower-integrity-refresh-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/synthesize/checkout-v7-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact synthesis head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: synthesize/checkout-v7-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Regenerate ledger from intended final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integrity-refresh-once.yml
          python - <<'PY'
          from tower.integrity import write_manifest
          write_manifest()
          PY
          tower integrity verify
          pytest -q
          git diff --check

      - name: Commit exact regenerated ledger and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add .integrity/file_hashes.json .github/workflows/integrity-refresh-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: regenerate integrity ledger from final checkout-v7 synthesis tree'
          git push origin HEAD:synthesize/checkout-v7-20260807
