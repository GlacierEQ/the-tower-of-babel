name: One-time Native Proof Promotion

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-time-native-proof-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.head_commit.message == 'chore: one-time quality sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the living main worker
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tower governance
        run: python -m pip install -e .[dev]

      - name: Promote only behaviorally executed native floors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_paths = [
              Path('registry/tower.d/systems.json'),
              Path('src/tower/data/tower.d/systems.json'),
          ]
          canonical = json.loads(registry_paths[0].read_text(encoding='utf-8'))
          by_id = {row['id']: row for row in canonical['technologies']}

          c = by_id['c']
          c['evidence_state'] = 'tested'
          c['proof_class'] = 'behavioral'
          c['toolchain']['build'][0] = [
              'gcc', '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror',
              'languages/c/easy_linked_list.c', '-o', 'build/c_easy',
          ]
          c['toolchain']['build'][1] = [
              'gcc', '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror', '-pthread',
              'languages/c/advanced_lockfree_spsc_ring.c', '-o', 'build/c_advanced',
          ]
          c['toolchain']['test'] = [['build/c_easy'], ['build/c_advanced']]

          cpp = by_id['cpp']
          cpp['evidence_state'] = 'tested'
          cpp['proof_class'] = 'behavioral'
          cpp['toolchain']['build'][0] = [
              'g++', '-std=c++20', '-O2', '-Wall', '-Wextra', '-Werror',
              'languages/cpp/easy_vector.cpp', '-o', 'build/cpp_easy',
          ]
          cpp['toolchain']['build'][1] = [
              'g++', '-std=c++20', '-O2', '-Wall', '-Wextra', '-Werror',
              'languages/cpp/advanced_kv_entropy.cpp', '-o', 'build/cpp_advanced',
          ]
          cpp['toolchain']['test'] = [['build/cpp_easy'], ['build/cpp_advanced']]

          rendered = json.dumps(canonical, sort_keys=True, separators=(',', ':')) + '\n'
          for path in registry_paths:
              path.write_text(rendered, encoding='utf-8')

          status_path = Path('quality/exhibit_status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['notes']['c'] = {
              'advanced_exhibit': 'languages/c/advanced_lockfree_spsc_ring.c',
              'observed_evidence': [
                  'bounded power-of-two queue',
                  'acquire/release memory ordering',
                  'capacity and overflow rejection',
                  '100000-frame concurrent handoff',
                  'FIFO sequence verification',
                  'structured execution receipt',
              ],
          }
          status['notes']['cpp'] = {
              'advanced_exhibit': 'languages/cpp/advanced_kv_entropy.cpp',
              'observed_evidence': [
                  'validated probability distributions',
                  'deterministic entropy-aware pruning',
                  'pinned-block capacity policy',
                  'complete decision accounting',
                  'malformed-input rejection',
                  'structured decision receipt',
              ],
          }
          status_path.write_text(json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Regenerate all canonical projections
        run: tower generate

      - name: Compile and execute promoted floors
        run: |
          set -euo pipefail
          mkdir -p build
          gcc -std=c17 -O2 -Wall -Wextra -Werror languages/c/easy_linked_list.c -o build/c_easy
          gcc -std=c17 -O2 -Wall -Wextra -Werror -pthread languages/c/advanced_lockfree_spsc_ring.c -o build/c_advanced
          g++ -std=c++20 -O2 -Wall -Wextra -Werror languages/cpp/easy_vector.cpp -o build/cpp_easy
          g++ -std=c++20 -O2 -Wall -Wextra -Werror languages/cpp/advanced_kv_entropy.cpp -o build/cpp_advanced
          build/c_easy
          build/c_advanced
          build/cpp_easy
          build/cpp_advanced

      - name: Remove bootstrap workflow and reseal integrity
        run: |
          rm -f .github/workflows/one-time-native-proof-sync.yml
          tower integrity generate

      - name: Verify the exact final tree
        run: |
          tower validate
          tower generate --check
          pytest -q
          tower integrity verify
          git diff --check

      - name: Commit governed proof promotion
        run: |
          git config user.name 'GlacierEQ governance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'quality: promote C and C++ with behavioral proof'
          git push origin HEAD:main
