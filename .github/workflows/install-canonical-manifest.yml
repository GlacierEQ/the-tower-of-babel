name: Install canonical language manifest

on:
  push:
    branches:
      - feature/canonical-manifest-clean
    paths:
      - tools/.seed-v4/**
      - tools/install_canonical_manifest.py
      - .github/workflows/install-canonical-manifest.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: install-canonical-language-manifest
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'push' || github.head_ref == 'feature/canonical-manifest-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean manifest branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-manifest-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and install canonical manifest
        run: python tools/install_canonical_manifest.py

      - name: Verify generated repository
        run: |
          python tools/generate.py --check
          python -m unittest tests/test_tower_of_babel.py

      - name: Commit installed engine
        run: |
          git config user.name "glaciereq-babel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: install canonical language manifest compiler"
          git push origin HEAD:feature/canonical-manifest-clean
