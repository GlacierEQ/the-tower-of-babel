name: One-time Tower Main Consolidation

on:
  push:
    branches:
      - dev/spiral-civilization-scale

permissions:
  contents: write

concurrency:
  group: tower-main-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.ref == 'refs/heads/dev/spiral-civilization-scale'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out completed worker branch
        uses: actions/checkout@v4
        with:
          ref: dev/spiral-civilization-scale
          fetch-depth: 0
          persist-credentials: true

      - name: Configure merge identity
        run: |
          git config user.name "GlacierEQ consolidation bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge current main and resolve governed overlaps
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true

          unresolved="$(git diff --name-only --diff-filter=U | sort)"
          printf 'Unresolved paths before policy resolution:\n%s\n' "$unresolved"

          # Canonical Tower-generated and governance surfaces remain authoritative.
          git checkout --ours -- README.md mastermind_sidecar.py src/babel_registry.py tests/test_tower_of_babel.py

          # Preserve the stronger implementation exhibits already developed on main.
          git checkout --theirs -- \
            languages/go/advanced_telemetry_decoder.go \
            languages/rust/advanced_safety_governor.rs \
            languages/typescript/advanced_mcp_gateway.ts

          git add README.md mastermind_sidecar.py src/babel_registry.py tests/test_tower_of_babel.py
          git add languages/go/advanced_telemetry_decoder.go
          git add languages/rust/advanced_safety_governor.rs
          git add languages/typescript/advanced_mcp_gateway.ts

          remaining="$(git diff --name-only --diff-filter=U | sort)"
          if [ -n "$remaining" ]; then
            printf 'Unexpected unresolved paths remain:\n%s\n' "$remaining" >&2
            exit 1
          fi

          git add -A

      - name: Remove bootstrap authority before sealing
        run: |
          rm -f .github/workflows/consolidate-main.yml
          git add -A

      - name: Install governed toolchain
        run: |
          python -m pip install -e .[dev]
          sudo apt-get update
          sudo apt-get install -y wabt protobuf-compiler sqlite3

      - name: Regenerate canonical surfaces and integrity ledger
        run: |
          tower generate
          tower integrity generate

      - name: Verify consolidated worker tree
        run: |
          tower validate
          tower generate --check
          pytest -q
          tower integrity verify
          tower build --all --allow-blocked --output artifacts/build-report.json
          tower benchmark python c cpp rust go typescript webassembly --output artifacts/benchmarks.json
          tower proof-report \
            --build-report artifacts/build-report.json \
            --benchmark-report artifacts/benchmarks.json \
            --allow-blocked \
            --output artifacts/proof-report.json
          tower receipt --build-report artifacts/build-report.json --output artifacts/tower_receipt.json
          python flagship/run_pipeline.py
          git diff --check

      - name: Commit the two-parent consolidation and push
        run: |
          git add -A
          git commit -m "merge: consolidate canonical Tower, quality upgrades, and Spiral Engine"
          git push origin HEAD:dev/spiral-civilization-scale
