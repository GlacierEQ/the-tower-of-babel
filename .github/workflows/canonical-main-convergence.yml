name: Canonical Main Convergence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-main-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.83.0"

      - name: Install verification toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc g++ protobuf-compiler wabt sqlite3
          npm install --global typescript@5.7.2
          python -m pip install -e .[dev]

      - name: Install permanent merged-branch hygiene
        env:
          BRANCH_HYGIENE_B64: 
        run: |
          set -euo pipefail
          printf '%s' "${BRANCH_HYGIENE_B64}" | base64 --decode > .github/workflows/branch-hygiene.yml
          rm .github/workflows/canonical-main-convergence.yml

      - name: Regenerate integrity seal
        run: tower integrity generate

      - name: Validate canonical surfaces
        run: |
          set -euo pipefail
          tower validate
          tower generate --check
          pytest -q
          tower integrity verify

      - name: Build governed floors
        run: tower build --all --allow-blocked --output /tmp/tower-build-report.json

      - name: Execute flagship mission pipeline
        run: python flagship/run_pipeline.py

      - name: Deploy final canonical main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/branch-hygiene.yml .github/workflows/canonical-main-convergence.yml .integrity/file_hashes.json
          git commit -m "chore: deploy canonical main and enforce branch hygiene"
          git push origin HEAD:main

      - name: Remove obsolete remote branches
        run: |
          set -euo pipefail
          for branch in feature/canonical-language-manifest feature/canonical-language-manifest-v2; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

      - name: Verify canonical branch topology
        run: |
          set -euo pipefail
          test -n "$(git ls-remote --heads origin refs/heads/main)"
          test -z "$(git ls-remote --heads origin refs/heads/feature/canonical-language-manifest)"
          test -z "$(git ls-remote --heads origin refs/heads/feature/canonical-language-manifest-v2)"
