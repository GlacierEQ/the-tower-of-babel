name: One-Time Literal Head Reseal

on:
  push:
    branches: [hardening/provenance-rulesets-claims]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-literal-head-reseal
  cancel-in-progress: false

jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch with promotion credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Remove temporary authority and generate exact final ledger
        run: |
          set -euo pipefail
          rm .github/workflows/reseal-literal-head-once.yml
          tower integrity generate
          tower integrity verify
          pytest -q

      - name: Publish helper-free machine-generated seal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish machine-generated literal-head seal"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
