name: Advanced Exhibit Gate

on:
  push:
    branches: [main]
    paths:
      - "languages/**"
      - "registry/**"
      - "src/tower/generate.py"
      - "tools/audit_advanced_exhibits.py"
      - "tests/test_advanced_exhibits.py"
      - "tests/test_nervous_system_contract.py"
      - "ADVANCED_EXHIBITS.md"
      - "quality/advanced_exhibit_atlas.json"
      - "governance/akos-nervous-system.v1.json"
      - ".glaciereq/nervous-system.node.json"
      - "scripts/validate_nervous_system.py"
      - ".github/workflows/advanced-exhibits.yml"
      - ".github/workflows/nervous-system-contract.yml"
  pull_request:
    paths:
      - "languages/**"
      - "registry/**"
      - "src/tower/generate.py"
      - "tools/audit_advanced_exhibits.py"
      - "tests/test_advanced_exhibits.py"
      - "tests/test_nervous_system_contract.py"
      - "ADVANCED_EXHIBITS.md"
      - "quality/advanced_exhibit_atlas.json"
      - "governance/akos-nervous-system.v1.json"
      - ".glaciereq/nervous-system.node.json"
      - "scripts/validate_nervous_system.py"
      - ".github/workflows/advanced-exhibits.yml"
      - ".github/workflows/nervous-system-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-exhibits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Tower
        run: python -m pip install -e .[dev]

      - name: Validate canonical authority
        run: tower validate

      - name: Reject generated and Atlas drift
        run: |
          set -euo pipefail
          tower generate --check
          python tools/audit_advanced_exhibits.py --check

      - name: Validate pinned nervous-system contract
        run: python scripts/validate_nervous_system.py --verify-remote --freshness

      - name: Run repository tests
        run: pytest -q

      - name: Execute all governed exhibit gates
        run: tower build --all --allow-blocked --output /tmp/advanced-exhibit-build-report.json

      - name: Verify immutable integrity
        run: tower integrity verify
