name: Advanced Exhibit Gate

on:
  push:
    branches: [main, hardening/advanced-exhibits]
    paths:
      - "languages/**"
      - "registry/**"
      - "src/tower/generate.py"
      - "tools/audit_advanced_exhibits.py"
      - "tools/promote_registry_and_cleanup.py"
      - "tests/test_advanced_exhibits.py"
      - ".github/workflows/advanced-exhibits.yml"
  pull_request:
    paths:
      - "languages/**"
      - "registry/**"
      - "src/tower/generate.py"
      - "tools/audit_advanced_exhibits.py"
      - "tools/promote_registry_and_cleanup.py"
      - "tests/test_advanced_exhibits.py"
      - ".github/workflows/advanced-exhibits.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advanced-exhibits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply one-time canonical promotion
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/promote_registry_and_cleanup.py ]]; then
            python tools/promote_registry_and_cleanup.py
            rm tools/promote_registry_and_cleanup.py
            echo "applied=true" >> "${GITHUB_OUTPUT}"
          else
            echo "applied=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Tower
        run: python -m pip install -e .[dev]

      - name: Validate canonical authority
        run: tower validate

      - name: Generate or verify derived surfaces
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.promotion.outputs.applied }}" == "true" ]]; then
            tower generate
            python tools/audit_advanced_exhibits.py --write
          else
            tower generate --check
            python tools/audit_advanced_exhibits.py --check
          fi

      - name: Run repository tests
        run: pytest -q

      - name: Execute all governed exhibit gates
        run: tower build --all --allow-blocked --output /tmp/advanced-exhibit-build-report.json

      - name: Seal or verify integrity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.promotion.outputs.applied }}" == "true" ]]; then
            tower integrity generate
          fi
          tower integrity verify

      - name: Promote generated hardening commit
        if: steps.promotion.outputs.applied == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden and expose all advanced Tower exhibits"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
